[alembic]
# Diretório que contém este arquivo — env.py, script.py.mako e versions/.
script_location = %(here)s

# A URL real vem sempre de app.core.config.get_settings() (ou seja, do
# ambiente/.env), definida em tempo de execução por env.py. Este valor é
# apenas um placeholder para o caso de alguém rodar `alembic` sem o pacote
# da aplicação disponível — nunca é usado quando env.py consegue importar a
# configuração da aplicação.
sqlalchemy.url = driver://user:pass@localhost/dbname

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
